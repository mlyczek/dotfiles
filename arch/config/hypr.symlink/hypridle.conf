general {
	lock_cmd = pidof hyprlock || hyprlock      # avoid starting multiple hyprlock instances
	before_sleep_cmd = loginctl lock-session   # lock before suspend
	after_sleep_cmd = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # to avoid having to press a key twice to turn on the screen
    inhibit_sleep = 3
}

listener {
	timeout = 150   # 2.5 min.
	on-timeout = brightnessctl -s --device=amdgpu_bl1 set 20
	on-resume = brightnessctl -r --device=amdgpu_bl1
}

listener {
	timeout = 300  # 5 min.
	on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'  # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r --device=amdgpu_bl1 # screen on when activity is detected after timeout has fired.
}
